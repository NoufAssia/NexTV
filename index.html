<!doctype html>
<html lang="en" class="overflow-y-auto  scrollbar-thumb-purple-500/80 scrollbar-track-indigo-950">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NexTV | Live TV & Streaming</title>
    <meta
      name="description"
      content="Discover NexTV, your altimate live TV streaming platform. Explore channels, browse categories, and enjoy your favorite entertainment in one place."
    />
    <link rel="icon" href="./assets/nextv-logo.png" type="" alt="nextv logo" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body
    class="min-h-screen mx-auto max-w-[1600px] font-['Inter',_sans-serif] bg-linear-to-bl from-[#632496] via-[#090979] to-[#07070D]  "
  >
    <header
      class="grid grid-cols-2 items-center md:grid-cols-[auto_auto_auto] gap-4 px-3 py-3 md:gap-6 md:px-6 md:py-4 text-sm text-white"
    >
      <div class="flex items-center gap-1  justify-self-start">
        <img src="./assets/nextv-logo.png" alt="nextv logo" class="w-15" />
        <div class="flex flex-col">
          <img src="./assets/nextv-text.png" alt="nextv name" class="w-35" />
          <!-- <p class="text-white text-[14px]">YOUR WORLD LIVE</p> -->
        </div>
      </div>
      <div
        class="flex items-center gap-4  justify-self-end md:order-last "
      >
        <button
          type="button"
          class="rounded-2xl p-1.5 px-2 text-md border shadow-md border-[0.3px] border-white/30 bg-white/[0.03] hover:bg-white hover:text-[#632496]"
        >
          sign in
        </button>
        <img src="./assets/bell.png" alt="bell icon" class="w-6" />
        <img src="./assets/dotss.png" alt="settings icon" class="w-4" />
      </div>

      <div
        class="date-time col-span-2  md:col-span-1 flex justify-center gap-3 p-1.5 px-2 "
      >
        <span id="time"></span>
        <span id="date"></span>
      </div>

      <!-- <div
        class="col-span-2 sm:col-span-1 md:col-span-1 flex max-w-xl items-center justify-center gap-2 border shadow-md border-[0.3px] rounded-2xl border-white/30 p-1 bg-white/[0.03]"
      >
        <img src="./assets/television.png" alt="tv icon" class="w-6" />
        <p class="mb-[-3.5px]">Live TV</p> -->
      </div>
    </header>


    <div id="list-container" class="flex md:flex-row w-full h-screen text-white flex-col">
      <aside class="w-full md:w-72 flex flex-col  shadow-[3px_-3px_16px_0_rgba(0,0,0,0.2)] p-4 shrink-0">
                    <div
        class=" flex max-w-xl items-center md:items-center gap-2 border shadow-md border-[0.3px] rounded-2xl border-white/30 p-1 px-2 mb-5 bg-white/[0.03]"
      >
        <img
          src="./assets/search-icon.png"
          alt="search icon"
          class="w-6 shrink-0"
        />
        <input
          type="search"
          id="search"
          class="w-full min-w-0 border-none focus:outline-none text-white"
        />
      </div>
        <div
          class="flex max-w-xl items-center gap-2  pb-3 px-2"
        >
          <button id="catgeory"><img
            src="./assets/left-arrow.png"
            alt="category icon"
            class="w-4 shrink-0"
          /></button>

        </div>


        <!-- loading state -->

        <div id="loading" class="flex flex-col items-center justify-center gap-4 pt-10 h-30">
            <div class="w-8 h-8 rounded-full border-4 border-white/20 border-t-cyan-400 border-r-purple-500 animate-spin"></div>
            <div class="text-sm text-white/70">Loading channels...</div>
        </div>

         <!-- error state -->

             <div id ="error-div" class="hidden flex flex-col items-center justify-center gap-4 pt-10">
            <p class="text-red-400 text-sm ">Unable to load channels</p>
            <p id="error-message" class="text-white/70 text-sm items-center"></p>
            <button id="retry-btn" class="flex items-center gap-2 px-4 py-2 rounded-lg bg-purple-500 hover:bg-cyan-600 text-white text-sm">Retry ↻</button>
        </div>

        
        <div id="listCahnnel" class="  flex flex-col gap-1.5 h-full overflow-y-auto scrollbar-thin scrollbar-thumb-purple-500/80 scrollbar-track-indigo-950"></div>
        <!-- <div class="flex-end border border-t border-white/50 w-full ">
            <p>Favorites</p>
        </div> -->

       

   
      </aside>

      <div class="flex-1 flex flex-col">
        <section
          id="play"
          class="flex-1 flex items-center justify-center  shadow-[0_-3px_16px_0_rgba(0,0,0,0.2)] "
        ></section>
        <section
          id="epg"
          class="flex-1 shadow-[0_-3px_16px_0_rgba(0,0,0,0.2)]"
        ></section>
      </div>
    </div>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
