<!doctype html>
<html lang="en" class="overflow-y-auto  scrollbar-thumb-purple-500/80 scrollbar-track-indigo-950">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NexTV | Live TV & Streaming</title>
    <meta
      name="description"
      content="Discover NexTV, your altimate live TV streaming platform. Explore channels, browse categories, and enjoy your favorite entertainment in one place."
    />
    <link rel="icon" href="./assets/nextv-logo.png" type="" alt="nextv logo" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body
    class="bg-fixed  max-w-[1600px] font-['Inter',_sans-serif] bg-linear-to-bl from-[#632496] via-[#090979] to-[#07070D]  "
  >
    <header
      class="grid grid-cols-2 items-center md:grid-cols-[auto_auto_auto] gap-4 px-3 py-3 md:gap-6 md:px-6 md:py-4 text-sm text-white"
    >
      <div class="flex items-center gap-1  justify-self-start">
        <img src="./assets/nextv-logo.png" alt="nextv logo" class="w-15" />
        <div class="flex flex-col">
          <img src="./assets/nextv-text.png" alt="nextv name" class="w-35" />
          <!-- <p class="text-white text-[14px]">YOUR WORLD LIVE</p> -->
        </div>
      </div>
      <div
        class="flex items-center gap-4  justify-self-end md:order-last "
      >
        <button
          type="button"
          class="rounded-2xl p-1.5 px-2 text-md border shadow-md border-[0.3px] border-white/30 bg-white/[0.03] hover:bg-white hover:text-[#632496]"
        >
          sign in
        </button>
        <img src="./assets/bell.png" alt="bell icon" class="w-6" />
        <img src="./assets/dotss.png" alt="settings icon" class="w-4" />
      </div>

      <div
        class="date-time col-span-2  md:col-span-1 flex justify-center gap-3 p-1.5 px-2 "
      >
        <span id="time"></span>
        <span id="date"></span>
      </div>

      <!-- <div
        class="col-span-2 sm:col-span-1 md:col-span-1 flex max-w-xl items-center justify-center gap-2 border shadow-md border-[0.3px] rounded-2xl border-white/30 p-1 bg-white/[0.03]"
      >
        <img src="./assets/television.png" alt="tv icon" class="w-6" />
        <p class="mb-[-3.5px]">Live TV</p> -->
      </div>
    </header>


    <div id="list-container" class="flex md:flex-row w-full h-screen text-white flex-col">
      <aside class="w-full md:w-90 flex flex-col  shadow-[3px_-3px_16px_0_rgba(0,0,0,0.2)] p-4 shrink-0">

        <!-- search  -->

        <div
        class=" flex max-w-xl items-center md:items-center gap-2 border shadow-md border-[0.3px] rounded-2xl border-white/30 p-1 px-2 mb-5 bg-white/[0.03]"
      >
        <img
          src="./assets/search-icon.png"
          alt="search icon"
          class="w-6 shrink-0"
        />
        <input
          type="search"
          id="search"
          placeholder="Recherche TV en direct..."
          class="w-full min-w-0 border-none focus:outline-none text-white"
        />
      </div>

      <!-- category -->

        <div
          class=" relative flex max-w-xl items-center gap-2  pb-3 px-2"
        >
          <button id="category" type="button"><img
            src="./assets/left-arrow.png"
            alt="category icon"
            class="w-4 shrink-0"
          /></button>
            <span id="selected-category">ALL CATEGORIES</span>
            <div id="popup-category" class="hidden absolute top-full left-2 z-50 min-w-48 p-2 rounded-xl border border-white/20 bg-[#15105c] shadow-lg"></div>
        </div>


        <!-- loading state -->

        <div id="loading" class="flex flex-col items-center justify-center gap-4 pt-10 h-30">
            <div class="w-8 h-8 rounded-full border-4 border-white/20 border-t-cyan-400 border-r-purple-500 animate-spin"></div>
            <div class="text-sm text-white/70">Loading channels...</div>
        </div>

         <!-- error state -->

             <div id ="error-div" class="hidden flex flex-col items-center justify-center gap-4 pt-10">
            <p class="text-red-400 text-sm ">Unable to load channels</p>
            <p id="error-message" class="text-white/70 text-sm items-center"></p>
            <button id="retry-btn" class="flex items-center gap-2 px-4 py-2 rounded-lg bg-purple-500 hover:bg-cyan-600 text-white text-sm">Retry ↻</button>
        </div>

        <!-- channels list -->

        <div id="listCahnnel" class=" mt-2 flex flex-col gap-1.5  overflow-y-auto scrollbar-thin scrollbar-thumb-purple-500/80 scrollbar-track-indigo-950 text-center"></div>
        <!-- <div class="flex-end border border-t border-white/50 w-full ">
            <p>Favorites</p>
        </div> -->

       

   
      </aside>

      <div class="flex-1 flex flex-col min-h-0 ">

        <!-- play -->

        <section
          id="play"
          class="flex-1 flex items-center justify-center p-6  shadow-[0_-3px_16px_0_rgba(0,0,0,0.2)] "
        >
        <div id="host-div"  class="w-full aspect-[20/10] min-w-0 min-h-0 border border-sm border-black rounded-3xl ">
       <img id="default-img" src="./assets/image.png" alt="default-img" class=" rounded-3xl w-full h-full object-cover shadow-[-1px_-1px_16px_16px_rgba(0,0,0,0.35)]">
      </div>
    </section>

    <!-- epg -->
        <section
          id="epg"
          class="flex-1 grid grid-cols-2 md:grid-cols-4 items-center gap-4  md:items-start justify-between p-4 shadow-[0_-3px_16px_0_rgba(0,0,0,0.2)]"
        >
        <div id="currentProgram" class="hidden w-full p-4 text-md  border rounded-2xl  shadow-md border-[0.3px] border-purple-500/80 bg-white/[0.03] hover:bg-white/10">
          <p class="text-purple-500/80 font-bold text-center">Current program</p>
          <p id="epgCp" class="text-center text-sm"></p>
        </div>
        <div id="startTime" class="hidden w-full p-4 text-md border rounded-2xl  shadow-md border-[0.3px] border-purple-500/80 bg-white/[0.03] hover:bg-white/10">
          <p class="text-purple-500/80 font-bold text-center">Start time</p>
          <p id="epgSt" class="text-center text-sm"></p>
        </div>
        <div id="endTime" class="hidden w-full p-4 border rounded-2xl  text-md  shadow-md border-[0.3px] border-purple-500/80 bg-white/[0.03] hover:bg-white/10">
          <p class="text-purple-500/80 font-bold text-center">End time</p>
          <p id="epgEt" class="text-center text-sm"></p>
        </div>
        <div id="progressPercentage" class="hidden w-full p-4  text-md border rounded-2xl  shadow-md border-[0.3px] border-purple-500/80 bg-white/[0.03] hover:bg-white/10">
          <p class="text-purple-500/80 font-bold text-center ">Progress percentage</p>
          <p id="epgPp" class="text-center text-sm"></p>
        </div>
      </section>
      </div>
    </div>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
